services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  api:
    build: ./api
    environment:
      REDIS_URL: redis://redis:6379
      DESK_KEY: ${DESK_KEY:?DESK_KEY manquante, voir .env.example}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
  web:
    build: ./web
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  redis-data:
